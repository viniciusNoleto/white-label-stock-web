services:
  white-label-inventory-system-front:
    container_name: white-label-inventory-system-front
    user: node
    restart: unless-stopped
    tty: true
    env_file: .env
    build:
      dockerfile: ./configs/docker/node/Dockerfile.deploy
    networks:
      - white-label-inventory-system-network
    depends_on:
      white-label-inventory-system-postgres:
        condition: service_healthy

  white-label-inventory-system-server:
    container_name: white-label-inventory-system-server
    restart: unless-stopped
    tty: true
    build:
      dockerfile: ./configs/docker/nginx/Dockerfile.deploy
    ports:
      - ${APP_PORT:-80}:80
      - ${APP_SSL_PORT:-443}:443
    volumes:
      - ./configs/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./configs/docker/nginx/conf/route.conf:/etc/nginx/conf.d/route.conf
      - ./configs/docker/nginx/nginx-502-page.html:/nginx-502-page.html
      - /etc/letsencrypt/:/etc/letsencrypt/
    networks:
      - white-label-inventory-system-network
    depends_on:
      - white-label-inventory-system-front

  white-label-inventory-system-postgres:
    container_name: white-label-inventory-system-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - white-label-inventory-system-postgres-data:/var/lib/postgresql/data
    networks:
      - white-label-inventory-system-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-white_label_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  white-label-inventory-system-network:
    name: white-label-inventory-system-network
    driver: bridge

volumes:
  white-label-inventory-system-postgres-data:
    name: white-label-inventory-system-postgres-data
