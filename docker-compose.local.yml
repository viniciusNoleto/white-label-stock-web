services:
  white-label-inventory-system-front:
    container_name: white-label-inventory-system-front
    user: node
    restart: unless-stopped
    tty: true
    env_file: .env
    build:
      dockerfile: ./configs/docker/node/Dockerfile.local
    volumes:
      - ./:/app/
    ports:
      - ${APP_PORT:-80}:3000
    # A API (white-label-stock-api) roda em outro compose; o container a alcança pela porta publicada no host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - white-label-inventory-system-network

networks:
  white-label-inventory-system-network:
    name: white-label-inventory-system-network
    driver: bridge
