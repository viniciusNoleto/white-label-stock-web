server {
  listen                80;

  # Troque pelo domínio público antes de rodar `make certbot` — o certbot usa este
  # server_name para achar o bloco e adiciona aqui o `listen 443 ssl` e os certificados.
  server_name           _;

  charset utf-8;
  client_max_body_size        100M;

  gzip            on;
  gzip_types      text/plain application/xml application/json text/css application/javascript;
  gzip_min_length 1000;

  error_page 502 /nginx-502-page.html;

  location / {
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_redirect              off;
    proxy_read_timeout          1m;
    proxy_connect_timeout       1m;
    proxy_pass http://white-label-inventory-system-front:3000;
  }

  location = /nginx-502-page.html {
    root /;
  }

  access_log off;
}
