services:
  white-label-stock-web:
    container_name: white-label-stock-web
    user: node
    restart: unless-stopped
    tty: true
    env_file: .env
    build:
      dockerfile: ./configs/docker/node/Dockerfile.deploy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - white-label-stock-web-network
      - proxy

networks:
  white-label-stock-web-network:
    name: white-label-stock-web-network
    driver: bridge
  proxy:
    name: ${PROXY_NETWORK:-nginx-proxy-manager}
    external: true
